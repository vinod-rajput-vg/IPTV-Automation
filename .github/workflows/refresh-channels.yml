name: Refresh channel URLs

on:
  schedule:
    # 12:05 AM IST = 18:35 UTC on the previous day
    - cron: "35 18 * * *"
    # 12:05 PM IST = 06:35 UTC
    - cron: "35 6 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: refresh-channels
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate JSON and category TXT playlist
        run: python generate.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Output/channels.json Output/*.txt

          if git diff --cached --quiet; then
            echo "No generated playlist changes detected."
            exit 0
          fi

          git commit -m "Refresh channel URLs"
          git push origin HEAD:main
