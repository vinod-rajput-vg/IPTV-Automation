name: Refresh channel URLs

on:
  schedule:
    - cron: '30 18 * * *' # 12 AM IST
    - cron: '30 6 * * *'  # 12 PM IST
  workflow_dispatch:
  pull_request:

# Pull requests receive read-only permissions. The write-capable refresh job
# never checks out or executes pull-request code.
permissions:
  contents: read

concurrency:
  group: refresh-channels-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'default' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m py_compile generate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m py_compile generate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate channel playlists
        run: python generate.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Output/ Servers/

          if git diff --cached --quiet; then
            echo "No generated playlist changes detected."
            exit 0
          fi

          git commit -m "Refresh channel URLs"

          # Retry against the latest main if another writer pushed concurrently.
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
            else
              git rebase --abort || true
            fi

            echo "Push attempt $attempt failed; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "Could not push generated files after 3 attempts."
          exit 1
