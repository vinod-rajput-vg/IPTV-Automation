name: Refresh channel URLs

on:
  schedule:
    - cron: '40 18 * * *'
    - cron: '40 6 * * *'
    - cron: '40 12 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: refresh-channels
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile generate.py

      - name: Generate JSON and category TXT playlist
        if: github.event_name != 'pull_request'
        run: python generate.py

      - name: Commit and push generated files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Output/ Servers/

          if git diff --cached --quiet; then
            echo "No generated playlist changes detected."
            exit 0
          fi

          git commit -m "Refresh channel URLs"

          # The remote may have received another commit during this workflow.
          # Rebase this generated commit onto the latest main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
