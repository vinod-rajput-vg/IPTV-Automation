name: Refresh channel URLs

on:
  schedule:
    - cron: '*/30 * * * *' # Retry window starts every 30 minutes
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate.py"
      - "Sorted Channels/**"
      - ".github/workflows/refresh-channels.yml"

# The workflow defaults to read-only; only the refresh job can write to main.
permissions:
  contents: read

concurrency:
  group: refresh-channels
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate, generate, and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep successful server catalogs for this retry window only.
          export IPTV_RETRY_CACHE="$RUNNER_TEMP/iptv-catalog-cache"
          rm -rf "$IPTV_RETRY_CACHE"
          mkdir -p "$IPTV_RETRY_CACHE"

          # Regenerate from the newest main on every retry. Never resolve output
          # conflicts by overwriting a newer commit with an older playlist.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # Publish any successful server updates immediately, then retry
            # failed servers. Existing entries for failed servers are preserved.
            while true; do
              if python generate.py; then
                break
              fi

              git add Output/`n              if [ -d Servers ]; then git add Servers/; fi
              if ! git diff --cached --quiet; then
                git commit -m "Partially refresh available channel URLs"
                until git push origin HEAD:main; do
                  echo "Push failed; rebasing the saved playlist updates onto latest main."
                  git fetch origin main
                  git rebase origin/main
                  sleep 10
                done
              fi

              echo "Some servers are unavailable; retrying in 5 minutes."
              sleep 300
              git fetch origin main
              git rebase origin/main
            done

            git add Output/`n              if [ -d Servers ]; then git add Servers/; fi
            if git diff --cached --quiet; then
              echo "No generated playlist changes detected."
              exit 0
            fi

            git commit -m "Refresh channel URLs"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "Could not push generated files after 3 attempts."
          exit 1
