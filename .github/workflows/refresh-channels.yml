name: Refresh channel URLs

on:
  schedule:
    - cron: '0 18 * * *'  # 12 AM IST
    - cron: '0 6 * * *'   # 12 PM IST
      
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: refresh-channels
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile generate.py

      - name: Generate channel files
        run: python generate.py

      - name: Commit and push generated files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d "Output" ]; then
            git add -A -- Output/
          else
            echo "ERROR: generate.py did not create Output/."
            exit 1
          fi

          if [ -d "Servers" ]; then
            git add -A -- Servers/
          fi

          if git diff --cached --quiet; then
            echo "No generated playlist changes detected."
            exit 0
          fi

          git commit -m "Refresh channel URLs"

          # Retry against the latest main if another writer pushed concurrently.
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi

              git rebase --abort || true
            else
              git rebase --abort || true
            fi

            echo "Push attempt $attempt failed; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "Could not push generated files after 3 attempts."
          exit 1
